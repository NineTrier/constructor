
<!doctype html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}{% endblock %}</title>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.7.1/jquery.min.js" type="text/javascript"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.2.1/css/all.css">
    {% block connection %}{% endblock %}
</head>
<body>
    <script src="https://unpkg.com/vue@next"></script>
    <header>
        <div class="d-flex flex-column flex-md-row align-items-center pb-3 mb-4 border-bottom">
          <a href="{% url 'home' %}" class="d-flex align-items-center text-dark text-decoration-none">
            <span class="fs-4">Веб-сервис</span>
          </a>

          <nav class="d-inline-flex mt-2 mt-md-0 ms-md-auto">
              <a class="me-3 py-2 text-dark text-decoration-none" href="{% url 'home' %}">Главная</a>
              <a class="me-3 py-2 text-dark text-decoration-none" href="{% url 'about' %}">О нас</a>
              <a class="me-3 py-2 text-dark text-decoration-none" href="{% url 'documents' %}">Загрузить документ</a>
              <a class="me-3 py-2 text-dark text-decoration-none" href="{% url 'newdocuments' %}">Создать документ</a>
          </nav>
        </div>
    </header>
    <div>
        {% block content %}{% endblock %}
    </div>
    {% block script %}{% endblock %}

</body>
</html>
