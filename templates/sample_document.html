  <!-- Panel for template tools.  The markup is included directly here so you can open
       this file standalone without Django.  In your project, you should use
       `{% include 'documents/_tools_panel.html' %}` instead. -->
  <div id="documents-tools-panel" class="documents-tools-panel">
    <div class="documents-tools-header">
      <h3>Template Tools</h3>
    </div>
    <div class="documents-tools-actions">
      <button id="documents-validate-btn" type="button">Check Placeholders</button>
      <button id="documents-generate-async-btn" type="button">Generate with Progress</button>
    </div>
    <div id="documents-validation-result" class="documents-tools-result"></div>
    <div id="documents-render-progress" class="documents-tools-progress"></div>
  </div>

  <!-- In a real project the API endpoints would be provided by Django.  For this
       example we stub the responses using a simple fetch override.  Feel free
       to remove this script when integrating into your project. -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Save the original fetch
      const orig = window.fetch;
      window.fetch = async function(url, options) {
        // Stub validation endpoint
        if (url.includes('/validate/')) {
          return {
            ok: true,
            async json() {
              return { issues: [
                'Unknown field: foo',
                'Unknown filter: bar'
              ] };
            }
          };
        }
        // Stub render start endpoint
        if (url.includes('/generate/async/')) {
          return {
            ok: true,
            async json() {
              return { job_id: 1 };
            }
          };
        }
        // Stub job polling endpoint
        if (url.includes('/jobs/1/poll/')) {
          return {
            ok: true,
            async json() {
              return {
                status: 'completed',
                placeholders_replaced: 5,
                placeholders_total: 5,
                events: [
                  { timestamp: new Date().toISOString(), message: 'Render started' },
                  { timestamp: new Date().toISOString(), message: 'Render complete' }
                ],
                output_file: '#'
              };
            }
          };
        }
        return orig(url, options);
      };
    });
  </script>
