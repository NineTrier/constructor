services:
  web:
    build: .
    image: constructor-web:latest
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - ${HOST_STATIC_PATH:-C:/constructor/static}:/app/staticfiles
      - ${HOST_MEDIA_PATH:-C:/constructor/media}:/app/media
    restart: unless-stopped

  db:
    image: postgres:17
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-constructor}
      POSTGRES_USER: ${POSTGRES_USER:-constructor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-constructor}
    ports:
      - "5432:5432"
    volumes:
      - ${HOST_POSTGRES_PATH:-C:/constructor/postgres}:/var/lib/postgresql/data
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.12.0
    env_file: .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - db
    volumes:
      - ${HOST_PGADMIN_PATH:-C:/constructor/pgadmin}:/var/lib/pgadmin
    restart: unless-stopped

  db_backup:
    image: postgres:17
    env_file: .env
    depends_on:
      - db
    environment:
      POSTGRES_HOST: ${BACKUP_POSTGRES_HOST:-db}
      POSTGRES_PORT: ${BACKUP_POSTGRES_PORT:-5432}
      BACKUP_BASE_DIR: /backups/database
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_RUN_ON_START: ${BACKUP_RUN_ON_START:-1}
    volumes:
      - ${HOST_BACKUP_PATH:-C:/constructor/backup}:/backups
      - ./docker/db_backup.sh:/usr/local/bin/db_backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/db_backup.sh"]
    restart: unless-stopped
